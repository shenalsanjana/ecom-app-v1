# Canonical host: https://www.dressingbear.com
#
# The app has exactly ONE origin. APP_URL and AUTH_URL both point at the www
# host, and NextAuth rewrites every incoming request URL to AUTH_URL's origin
# before proxy.ts sees it (next-auth/lib/env.js `reqWithEnvURL`). So while the
# apex was served as a co-equal origin, a protected route requested on the apex
# was answered with a redirect to the www host — cross-origin. Browsers block
# that for Next's RSC prefetches (they use fetch(), so CORS applies) and auth
# cookies set on one host never applied to the other. Redirecting the apex here
# means the app only ever sees its canonical origin.

server {
    listen 80;
    listen [::]:80;

    server_name dressingbear.com www.dressingbear.com;

    # Must be served over plain HTTP straight from the certbot webroot.
    # Redirecting it to HTTPS hands Let's Encrypt to `location /` below, which
    # proxies to the app and 404s — silently breaking `certbot renew`.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.dressingbear.com$request_uri;
    }
}

# Apex over HTTPS. Terminates TLS (the certificate covers both names) purely so
# it can answer with the canonical-host redirect.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dressingbear.com;

    ssl_certificate /etc/letsencrypt/live/dressingbear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dressingbear.com/privkey.pem;

    return 301 https://www.dressingbear.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.dressingbear.com;

    ssl_certificate /etc/letsencrypt/live/dressingbear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dressingbear.com/privkey.pem;

    # Served directly from the shared volume, not proxied to the app. Next's
    # standalone server resolves local file/image existence once at process
    # boot, so files added to this volume later (every admin upload) are
    # invisible to it until a restart — nginx reads the filesystem fresh on
    # every request, so uploads show up immediately. next/image call sites
    # for these files must set `unoptimized` (see app/_lib/uploaded-image.ts)
    # so the browser requests this raw path instead of /_next/image.
    location /uploads/ {
        alias /app/public/uploads/;
        access_log off;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
