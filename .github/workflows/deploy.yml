name: Deploy

on:
  push:
    branches: [main]

# Two deploys must never overlap: each runs `prisma migrate deploy` against the
# one production database. Queue instead of cancelling — a cancelled deploy
# could be interrupted mid-migration.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# Default token scope for every job below: read-only. `actions/checkout@v4`
# would otherwise persist a repo-writable GITHUB_TOKEN into .git/config,
# readable by any malicious transitive-dependency postinstall during
# `npm ci`. Neither job needs to write to the repo.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mirrors Dockerfile:24 — the suites import types from @prisma/client.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm run test

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    # Requires a `production` environment with a required reviewer configured in
    # repo settings. That configuration is what makes this job pause for
    # approval; without it this deploys unattended.
    environment: production
    timeout-minutes: 30
    steps:
      - name: Verify main has not moved since this run was approved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # This job pauses at the `production` environment for reviewer
          # approval (once that environment is configured — see
          # DEPLOY_OVH.md §4.1). If a second push lands to `main` while this
          # run is awaiting approval, approving THIS run must not deploy
          # THAT newer, unreviewed commit. Fail fast instead: refuse to
          # deploy unless github.sha is still the tip of origin/main.
          latest_sha="$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/commits/main" \
            | jq -r '.sha')"
          if [ "$latest_sha" != "$EXPECTED_SHA" ]; then
            echo "ERROR: main has moved since this run's commit ($EXPECTED_SHA) was tested." >&2
            echo "main is now at $latest_sha. Approving this run would deploy an untested commit." >&2
            echo "Do not approve this run — approve (or wait for) the run for $latest_sha instead." >&2
            exit 1
          fi
          echo "OK: $EXPECTED_SHA is still the tip of main."

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Host key is pinned from a secret. Never substitute a runtime
          # ssh-keyscan or StrictHostKeyChecking=no — both accept a MITM.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run deploy script on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST" \
              'cd /opt/dressingbear && ./scripts/deploy.sh'

      - name: Verify the site is healthy
        run: |
          # docker-compose.yml's nginx service has `depends_on: app:
          # condition: service_healthy` (backed by the Dockerfile
          # HEALTHCHECK), so `docker compose up -d` in deploy.sh already
          # blocks until the app container reports healthy before it
          # returns — it does NOT return immediately. This loop instead
          # covers the remaining gap: nginx itself starting up and the
          # first real HTTPS request succeeding. Poll for up to ~6 minutes
          # worst case (24 attempts x (10s curl timeout + 5s sleep)).
          #
          # This runs BEFORE the commit-mismatch check below so that
          # whatever ended up deployed — even an unintended commit that won
          # a race against the preflight check — is at least confirmed
          # alive before the job can fail. If the SHA assertion ran first,
          # a mismatch would abort the job without ever confirming
          # production is serving a working site.
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 10 https://dressingbear.com/api/health | grep -q '"status":"ok"'; then
              echo "Health check passed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt: not healthy yet, retrying in 5s..."
            sleep 5
          done
          echo "Health check FAILED: /api/health did not report ok within ~6 minutes (worst case)." >&2
          exit 1

      - name: Verify the VPS deployed the reviewed commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # This does NOT close the race between the preflight check above
          # and deploy.sh's own `git pull origin main` — it only DETECTS a
          # lost race after the fact. If a push landed in that window,
          # deploy.sh has already pulled, migrated, and restarted on the
          # newer, unreviewed commit by the time this step runs; the health
          # check above has already run against that commit too. A failure
          # here means production is live on an unintended commit and needs
          # manual intervention — see DEPLOY_OVH.md §4.1.
          deployed_sha="$(ssh -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              "$VPS_USER@$VPS_HOST" \
              'cd /opt/dressingbear && git rev-parse HEAD')"
          if [ "$deployed_sha" != "$EXPECTED_SHA" ]; then
            echo "ERROR: the VPS deployed a different commit than this run approved." >&2
            echo "Expected $EXPECTED_SHA, but the VPS is now at $deployed_sha." >&2
            echo "A newer push likely won the race against this deploy. Investigate before trusting production." >&2
            exit 1
          fi
          echo "OK: VPS is running the reviewed commit $EXPECTED_SHA."

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
