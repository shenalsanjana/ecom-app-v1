name: DB Migrate

# Manual migration fallback. Production migrations normally run inside the Vercel
# build command (`prisma migrate deploy` before `next build`, see vercel.json) so
# the schema is always current before pages prerender against the DB. The `push`
# trigger was removed to avoid two `migrate deploy` jobs racing the same database;
# use "Run workflow" here if you ever need to migrate without a full redeploy.
on:
  workflow_dispatch: {}

# Never run two migration jobs against the same database at once.
concurrency:
  group: db-migrate-main
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # One-time baseline-drift fix preserved verbatim from the old Vercel build
      # command. Safe to delete once a clean `migrate deploy` is confirmed.
      - run: npx prisma migrate resolve --applied 20260527000000_add_user_role || true
      - run: npx prisma migrate deploy
